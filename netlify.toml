# Netlify Configuration - Netflix Clone
# The app lives in the Netflix-clone/ subdirectory

[build]
  base = "Netflix-clone/"
  command = "npm install && npm run build"
  publish = "Netflix-clone/dist"

# Environment variables for build
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# React Router SPA: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
