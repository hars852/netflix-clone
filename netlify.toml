# Netlify Configuration - Netflix Clone
# The app lives in the Netflix-clone/ subdirectory

[build]
  base = "Netflix-clone/"
  command = "npm install && npm run build"
  publish = "dist"

# Environment variables for build - Node 20 required for Vite 7 and React Router 7
[build.environment]
  NODE_VERSION = "20"

# React Router SPA: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
